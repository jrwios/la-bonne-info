name: Mise à jour de l'édition

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-edition.mjs
      - name: Enregistrer les changements
        run: |
          git config user.name "bot-la-bonne-info"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "Édition automatique" && git push)
