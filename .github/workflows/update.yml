name: Mise à jour de l'édition

on:
  schedule:
    - cron: '30 4 * * *'
    - cron: '30 9 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: edition
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-edition.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Enregistrer les changements
        run: |
          git config user.name "bot-la-bonne-info"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add data
          git diff --staged --quiet || (git commit -m "Édition automatique" && git push)
